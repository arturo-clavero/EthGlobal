<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Verify evidence</title>
<script type="importmap">
{
  "imports": {
    "@arkiv-network/sdk": "https://esm.sh/@arkiv-network/sdk@1.0.1?deps=viem@2.57.6",
    "@arkiv-network/sdk/chains": "https://esm.sh/@arkiv-network/sdk@1.0.1/chains?deps=viem@2.57.6",
    "@arkiv-network/sdk/query": "https://esm.sh/@arkiv-network/sdk@1.0.1/query?deps=viem@2.57.6",
    "@arkiv-network/sdk/schema": "https://esm.sh/@arkiv-network/sdk@1.0.1/schema?deps=viem@2.57.6",
    "viem": "https://esm.sh/viem@2.57.6"
  }
}
</script>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --card: #fff; --line: #e7e5e4; --ok: #15803d; --bad: #b91c1c; --warn: #a16207; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524; --line: #44403c; --ok: #4ade80; --bad: #f87171; --warn: #facc15; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 16rem; min-width: 0; padding: .6rem; font: inherit; font-family: ui-monospace, monospace; font-size: .85rem;
    background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: .4rem; }
  button { padding: .6rem 1rem; font: inherit; border-radius: .4rem; border: 1px solid var(--line); background: var(--fg); color: var(--bg); cursor: pointer; }
  #drop { margin-top: .75rem; padding: 1rem; border: 1px dashed var(--line); border-radius: .4rem; color: var(--muted); text-align: center; }
  #drop.over { border-color: var(--fg); }
  #result { margin-top: 1.5rem; padding: 1.25rem; background: var(--card); border: 1px solid var(--line); border-radius: .6rem; }
  #result[hidden] { display: none; }
  .status { font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .claim { font-size: 1.2rem; margin: .5rem 0 0; }
  details { margin-top: 1rem; color: var(--muted); font-size: .9rem; }
  details ul { padding-left: 1.2rem; }
  code { font-size: .8rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Verify evidence</h1>
  <form id="form">
    <input id="commitment" type="text" placeholder="Commitment (64 hex characters)" autocomplete="off" spellcheck="false">
    <button type="submit">Verify</button>
  </form>
  <label id="drop">Or drop a bundle or attestation file here, or <input id="file" type="file" accept="application/json,.json"></label>
  <section id="result" hidden aria-live="polite"></section>
</main>
<script type="module" src="./page.mjs"></script>
</body>
</html>
